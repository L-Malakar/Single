[package]
name = "single"
version = "0.1.5"
edition = "2021"
description = "Single — connect all devices in a room into one."
authors = ["L. Malakar"]
license = "MIT"

[lib]
name = "single_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Single"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
single-core = { path = "../crates/single-core" }

[profile.release]
strip = true
# NOTE: no `lto = true` and no `codegen-units = 1` on purpose. Those make
# rustc peak at several GB of RAM per crate (the `windows` crate alone can
# exhaust an 8 GB machine), killing the build with
# "memory allocation of ... bytes failed". The default settings compile
# everywhere; the size difference is a few MB.
