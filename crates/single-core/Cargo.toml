[package]
name = "single-core"
version = "0.1.5"
edition = "2021"
license = "MIT"
description = "Core engine of Single: LAN device discovery, PIN-approved encrypted pairing, HTTPS/WebDAV transfer and cross-device file access."
authors = ["L. Malakar"]
repository = "https://github.com/L-Malakar/Single"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
anyhow = "1"
httpdate = "1"
percent-encoding = "2"
socket2 = "0.5"
if-addrs = "0.13"
time = "0.3"
dirs = "5"

[dev-dependencies]
