[package]
name = "p2p-bridge"
version = "0.1.1"
edition = "2021"
description = "LAN cross-platform control server: mDNS auto-discovery, WebSocket dashboard, peer-to-peer TCP handshake with chat and file transfer"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"

[[bin]]
name = "p2p-bridge-server"
path = "src/main.rs"

[[bin]]
name = "device-simulator"
path = "src/bin/device_simulator.rs"

# Smaller, stripped release binaries for the packaged "Single" app.
[profile.release]
lto = "thin"
strip = true

# Embeds static/logo.ico into the Windows exes (see build.rs).
[build-dependencies]
winresource = "0.1"
