plugins {
    id 'com.android.application'
}

android {
    namespace 'app.single.bridge'
    compileSdk 34

    defaultConfig {
        applicationId "app.single.bridge"
        minSdk 24        // Android 7.0
        targetSdk 34     // Android 14
        // versionCode derived from the version string (0.1.3 -> 103), so an
        // APK built after a version bump always updates an older install.
        versionCode computeVersionCode()
        // kept in sync by build.bat from Cargo.toml
        versionName project.findProperty('singleVersion') ?: '0.1.3'
    }

    // build.bat copies the cross-compiled Rust server into
    // src/main/jniLibs/<abi>/libsingle.so before invoking gradle;
    // Android extracts it (executable) to nativeLibraryDir at install time.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    signingConfigs {
        // ONE stable key for every build of this project (prebuilt APK,
        // gradle debug and release alike), so a newly installed APK always
        // updates an existing Single install instead of failing with
        // "App not installed". It lives in the repo on purpose — this is a
        // self-built LAN app, not a Play Store release. See android/README.md.
        single {
            storeFile rootProject.file('single.keystore')
            storePassword 'single-bridge'
            keyAlias 'single'
            keyPassword 'single-bridge'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.single
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.single
        }
    }

    lint {
        abortOnError false
    }
}

// "0.1.3" -> 0*10000 + 1*100 + 3 = 103 (monotonic across all 0.x.y releases)
def computeVersionCode() {
    def v = project.findProperty('singleVersion') ?: '0.1.3'
    def p = v.split('\\.')
    return p[0].toInteger() * 10000 + p[1].toInteger() * 100 + p[2].toInteger()
}

// The wrapper app intentionally uses only framework APIs — zero external
// dependencies keeps the first gradle run fast and offline-friendly.
