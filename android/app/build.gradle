plugins {
    id 'com.android.application'
}

android {
    namespace 'app.single.bridge'
    compileSdk 34

    defaultConfig {
        applicationId "app.single.bridge"
        minSdk 24        // Android 7.0
        targetSdk 34     // Android 14
        versionCode 13
        // kept in sync by build.bat from Cargo.toml
        versionName project.findProperty('singleVersion') ?: '0.1.3'
    }

    // build.bat copies the cross-compiled Rust server into
    // src/main/jniLibs/<abi>/libsingle.so before invoking gradle;
    // Android extracts it (executable) to nativeLibraryDir at install time.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    signingConfigs {
        // Stable project keystore (android/single.keystore) — every build
        // is signed with the SAME key, so a new APK installs right over the
        // previous one. Never delete or regenerate the keystore: Android
        // refuses cross-signature updates.
        //   keytool -genkeypair -keystore single.keystore -alias single \
        //     -keyalg RSA -keysize 2048 -validity 10950 \
        //     -storepass single-app -keypass single-app \
        //     -dname "CN=Single, OU=Single, O=Single, C=IN"
        single {
            storeFile file("../single.keystore")
            storePassword "single-app"
            keyAlias "single"
            keyPassword "single-app"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.single
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.single
        }
    }

    lint {
        abortOnError false
    }
}

// The wrapper app intentionally uses only framework APIs — zero external
// dependencies keeps the first gradle run fast and offline-friendly.
